}

  --bg:#0c1311; --surface:#131c19; --surface2:#1a2522; --ink:#e4ede9; --muted:#93a69e; --line:#283631;

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
*{box-sizing:border-box}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

h1{font-family:var(--font-display);font-size:20px;margin:0;font-weight:700;letter-spacing:0}
h2{font-family:var(--font-display);font-size:17px;margin:0 0 4px;font-weight:600;text-wrap:balance}
h3{font-size:15px;margin:0;font-weight:600}
.monthsw{display:flex;align-items:center;gap:6px;margin-inline-start:auto}
.monthsw .lbl{min-width:120px;text-align:center;font-weight:600}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;line-height:1.4}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{background:transparent}
button.small{padding:3px 9px;font-size:13px}
button.danger{color:var(--bad)}
.status{font-size:12px;color:var(--muted);padding:2px 8px;border-radius:99px;background:var(--surface2)}
.status.err{color:var(--bad)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:8px;scrollbar-width:none}
nav.tabs a{white-space:nowrap;text-decoration:none;color:var(--muted);padding:6px 12px;border-radius:8px;font-weight:500}
nav.tabs a.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
main{padding-block:16px 48px;display:grid;gap:16px}
.grid2{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:900px){.grid2{grid-template-columns:1.25fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card .sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .k{font-size:12.5px;color:var(--muted)}
.kpi .v{font-family:var(--font-display);font-size:22px;font-weight:600}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.debt .v{color:var(--debt)}
.kpi.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi.main .k,.kpi.main .s{color:var(--accent-ink);opacity:.85}
.bar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.kpi.main .bar{background:rgba(255,255,255,.25)}
.kpi.main .bar i{background:var(--accent-ink)}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--accent-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}

.line:last-child{border-bottom:0}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}

.mile:last-child{border-bottom:0}

.fields label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
.debtcard{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px}
.stack{display:grid;gap:12px}
.note{font-size:13px;color:var(--muted)}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13.5px}
.empty{text-align:center;padding:48px 16px}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-inline-end:5px}
svg text{fill:var(--muted);font-family:var(--font-body)}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.opt{border:1px solid var(--line);border-radius:var(--r);padding:12px}
.opt h3{margin-bottom:4px}

</div>

      .sort(function(a,b){return ((+a.prio||9)-(+b.prio||9))||(rem(a)-rem(b))});
    sn.forEach(function(d){
      var p=plan[d.id]||{reg:0,extra:0}, cap=rem(d);
      if(+d.cap>0)cap=Math.min(cap,+d.cap-p.reg);
      var x=take(cap); if(x>0){p.extra+=x;plan[d.id]=p}
    });
    var snowDone=S.debts.filter(function(d){return d.extra}).every(function(d){return rem(d)<=0.5});
    if(snowDone&&!ev.snowDone)ev.snowDone=m;
    var fl={car:0,box:0,ef:0,dep:0,fund:0};
    if(carDebt&&m<carDebt.balloonMonth&&(snowDone||(G.carStart&&m>=G.carStart))){
      var left=Math.max(1,diffM(m,carDebt.balloonMonth)), need=Math.max(0,bb[carDebt.id]-F.car);
      fl.car=take(Math.ceil(need/left/50)*50);
    }
    if(snowDone){
      fl.box=take(Math.min(+G.boxMonthly||0,Math.max(0,(+G.boxTarget||0)-F.box)));
      fl.ef=take(Math.max(0,(+G.efTarget||0)-F.ef));
    }
    if(cash>0&&+I.prepayPct>0&&I.prepayId){
      var pd=S.debts.find(function(d){return d.id===I.prepayId});
      if(pd&&(!pd.start||m>=pd.start)&&rem(pd)>0.5){var x=take(Math.min(rem(pd),cash*(+I.prepayPct)/100));var pp=plan[pd.id]||{reg:0,extra:0};pp.extra+=x;plan[pd.id]=pp}
    }
    if(cash>0){var dsh=Math.min(100,Math.max(0,+I.split||0))/100;fl.dep=Math.round(cash*dsh);fl.fund=cash-fl.dep;cash=0}
    // debts lines
    S.debts.forEach(function(d){
      var p=plan[d.id],k="debt:"+d.id,c=conf(k); if(!p&&!c)return;
      var planned=p?p.reg+p.extra:0,a=c?+c.amount:planned,before=bal[d.id];
      bal[d.id]=Math.max(0,before-a);
      lines.push({key:k,label:d.name,group:(p&&p.reg>0)?"debts":"extra",planned:planned,amount:a,confirmed:!!c,reg:p?p.reg:0,extra:p?p.extra:0,after:bal[d.id],debt:d.id});
      sched[d.id].push({m:m,reg:p?p.reg:0,extra:p?p.extra:0,planned:planned,amount:a,confirmed:!!c,before:before,after:bal[d.id]});
      if(bal[d.id]<=0.5&&bb[d.id]<=0.5&&!ev["close:"+d.id])ev["close:"+d.id]=m;
    });
    if(bl){
      var k2="balloon:"+bl.d.id,c2=conf(k2),a2=c2?+c2.amount:bl.need;
      bb[bl.d.id]=Math.max(0,bb[bl.d.id]-a2); F.car=Math.max(0,F.car-Math.min(F.car,a2));
      lines.push({key:k2,label:"الدفعة الأخيرة: "+bl.d.name,group:"debts",planned:bl.need,amount:a2,confirmed:!!c2,note:"من ادخار السيارة "+fmtT(bl.fromFund)+(bl.fromCash>0?" + من الفائض "+fmtT(bl.fromCash):"")});
      sched[bl.d.id].push({m:m,reg:0,extra:0,planned:bl.need,amount:a2,confirmed:!!c2,before:bl.need,after:bb[bl.d.id],balloon:true});
      if(bal[bl.d.id]<=0.5&&bb[bl.d.id]<=0.5&&!ev["close:"+bl.d.id])ev["close:"+bl.d.id]=m;
    }
    var FN={car:"ادخار دفعة السيارة الأخيرة",box:"صندوق المشتريات",ef:"صندوق الطوارئ",dep:"استثمار: ودائع ومرابحة",fund:"استثمار: صناديق"};
    ["car","box","ef","dep","fund"].forEach(function(f){
      var k="fund:"+f,c=conf(k); if(!(fl[f]>0)&&!c)return;
      var a=c?+c.amount:fl[f]; F[f]+=a; if(f==="dep"||f==="fund")contrib+=a;
      lines.push({key:k,label:FN[f],group:"funds",planned:fl[f],amount:a,confirmed:!!c,fund:f});
    });
    var buys=(S.boxBuys||[]).filter(function(b){return b.m===m});
    F.box-=sum(buys,function(b){return b.amount});
    var efo=(S.efOut||[]).filter(function(b){return b.m===m});
    F.ef-=sum(efo,function(b){return b.amount});
    F.dep*=1+(+I.rateDep||0)/1200; F.fund*=1+(+I.rateFund||0)/1200;
    if(F.ef>=(+G.efTarget||0)-0.5&&!ev.efDone&&+G.efTarget>0)ev.efDone=m;
    if(!ev.invStart&&(fl.dep+fl.fund)>0)ev.invStart=m;
    var totalDebt=0;Object.keys(bal).forEach(function(id){totalDebt+=bal[id]+bb[id]});
    var spends=(S.spend||[]).filter(function(x){return x.m===m});
    months.push({m:m,inc:inc,wind:wind,living:living,lines:lines,surplus0:surplus0,bal:Object.assign({},bal),bb:Object.assign({},bb),F:Object.assign({},F),contrib:contrib,totalDebt:totalDebt,spent:sum(spends,function(x){return x.amount}),spends:spends,buys:buys,efo:efo,deficit:surplus0<-0.5});
    if(totalDebt<=0.5&&!ev.debtFree)ev.debtFree=m;
  }
  var startDebt=0;S.debts.forEach(function(d){startDebt+=(+d.balance||0)+(+d.balloon||0)});
  return {months:months,sched:sched,ev:ev,startDebt:startDebt};
}

function showLock(){document.getElementById("view").innerHTML='<div class="card empty"><h2>خطتك مقفلة</h2><p class="note">اكتب الرمز السري لفتح أرقامك. بعد أول فتح تتحفظ على هذا الجوال.</p><form class="row" data-form="unlock" style="justify-content:center;margin-top:12px"><input type="password" inputmode="numeric" id="pin" autocomplete="current-password" style="width:160px;text-align:center" aria-label="الرمز السري"><button class="primary">فتح</button></form><p class="note" id="pinMsg"></p></div>'}
function unlock(pin){var enc=new TextEncoder();return crypto.subtle.importKey("raw",enc.encode(pin),"PBKDF2",false,["deriveKey"]).then(function(k){return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(ENC.salt),iterations:ENC.iter,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"])}).then(function(key){return crypto.subtle.decrypt({name:"AES-GCM",iv:b64(ENC.iv)},key,b64(ENC.ct))}).then(function(buf){return JSON.parse(new TextDecoder().decode(buf))})}

function boot(){

    var to=setTimeout(function(){if(!loaded){setStatus("تعذّر الوصول للبيانات الآن",true);localFallback()}},10000);
    docRef.onSnapshot(function(snap){
      var d=snap.data();
      if(!snap.metadata||!snap.metadata.fromCache)clearTimeout(to);
      if(!d||!d.json){if(!S){loaded=true;setStatus("لا توجد بيانات بعد");render()}return}
      var st;try{st=JSON.parse(d.json)}catch(e){return}

      adopt(st);setStatus("محفوظ");

function render(){
  var v=document.getElementById("view");
  document.querySelectorAll("#tabs a").forEach(function(a){a.classList.toggle("on",a.dataset.v===ui.view)});
  if(!loaded)return;
  if(!S){v.innerHTML=vEmpty();document.getElementById("mLbl").textContent="—";return}
  SIM=simulate(S);
  var last=addM(S.start,(+S.horizon||60)-1);
  if(!ui.month||ui.month<S.start)ui.month=S.start; if(ui.month>last)ui.month=last;
  document.getElementById("mLbl").textContent=mlabel(ui.month);
  var sx=window.scrollY;
  v.innerHTML=({home:vHome,plan:vPlan,schedules:vSchedules,invest:vInvest,edit:vEdit}[ui.view]||vHome)();
  window.scrollTo(0,sx);
}

  if(ds.conf){var el=document.getElementById("amt-"+ds.conf.replace(/[^a-z0-9]/gi,"_"));var a=el?+el.value:0;S.paid[ui.month+"|"+ds.conf]={amount:isFinite(a)?a:0,at:Date.now()};commit();return}
  if(ds.unconf){delete S.paid[ui.month+"|"+ds.unconf];commit();return}
  if(ds.confall){var M=SIM.months[mi(ui.month)];M.lines.forEach(function(l){if(!l.confirmed){var el=document.getElementById("amt-"+l.key.replace(/[^a-z0-9]/gi,"_"));S.paid[ui.month+"|"+l.key]={amount:el?+el.value:l.planned,at:Date.now()}}});commit();return}
  if(ds.goto){ui.month=ds.goto;location.hash="home";return}
  if(ds.debt){ui.debt=ds.debt;try{localStorage.setItem("finplan-ui",JSON.stringify({debt:ui.debt}))}catch(x){}render();return}
  if(ds.add){var k=ds.add,m=ui.month||todayKey();
    if(k==="incomes"||k==="living")S[k].push({id:uid(),from:m,amount:k==="living"?3500:0});
    if(k==="bills")S.bills.push({id:uid(),name:"اشتراك جديد",amount:0,from:m});
    if(k==="windfalls"||k==="efOut")S[k].push({id:uid(),m:m,amount:0,note:""});
    if(k==="debts")S.debts.push({id:uid(),name:"دين جديد",balance:0,monthly:0,start:m,prio:5,extra:true});
    commit();return}
  if(ds.blank){S=blankState();ui.month=S.start;commit();return}
  if(ds.export){exportFile();return}
  if(t.id==="mPrev"&&S){ui.month=addM(ui.month,-1);render()}
  if(t.id==="mNext"&&S){ui.month=addM(ui.month,1);render()}
  if(t.id==="mNow"&&S){ui.month=todayKey();render()}
});
function exportFile(){
  var data=JSON.stringify(S,null,1);
  var p=(window.claude&&window.claude.use)?window.claude.use("downloads"):Promise.resolve(null);
  Promise.resolve(p).then(function(dl){
    var msg=document.getElementById("impMsg");
    if(!dl){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download="finplan-"+todayKey()+".json";document.body.appendChild(a);a.click();a.remove();if(msg)msg.textContent="تم تنزيل النسخة.";return}
    dl.save({filename:"finplan-"+todayKey()+".json",data:new Blob([data],{type:"application/json"})}).then(function(){if(msg)msg.textContent="تم تنزيل النسخة."},function(){if(msg)msg.textContent="ما تم التنزيل."});
  });
}
function importFile(f){
  if(!f)return; var r=new FileReader();
  r.onload=function(){try{var st=JSON.parse(r.result);if(!st.debts||!st.start)throw 0;S=normalize(st);commit()}catch(x){var m=document.getElementById("impMsg");if(m)m.textContent="الملف غير صالح. اختر ملف نسخة نزلته من هنا."}};
  r.readAsText(f);
}
function route(){var h=(location.hash||"#home").slice(1);ui.view=["home","plan","schedules","invest","edit"].indexOf(h)>=0?h:"home";render()}
window.addEventListener("hashchange",route);
route();boot();
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(function(){})}
})();
</script>
